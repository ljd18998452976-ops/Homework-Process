<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务进程生成器</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/flatpickr/4.6.13/l10n/zh.min.js"></script>

    <!-- html2canvas：主 CDN + 自动备用 CDN -->
    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js';">
    </script>

    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #007bff;
            --success-color: #28a745;
            --warning-color: #f39c12;
            --danger-color: #dc3545;
            --bg-body: #f4f7f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-body);
            padding: 20px;
            color: #333;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 30px;
        }

        /* =========================
           左侧编辑器
           ========================= */
        .edit-area {
            flex: 1.2;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .top-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-item {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        .input-item:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(0,123,255,0.2);
        }

        /* =========================
           数据管理面板
           ========================= */
        .data-panel {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .data-panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-data {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-export-json {
            background: #fff;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-import-json {
            background: var(--primary-color);
            color: #fff;
        }

        .btn-export-json:hover {
            background: #f0f4f8;
        }

        .btn-import-json:hover {
            background: #002244;
        }

        /* =========================
           任务卡片
           ========================= */
        .task-card {
            background: #fcfcfc;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .day-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .day-group input {
            width: 60px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px;
            outline: none;
        }

        .day-group input:focus {
            border-color: var(--accent-color);
        }

        .type-row {
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-bottom: 8px;
        }

        .type-row label {
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .type-row textarea {
            width: 100%;
            height: 50px;
            margin-top: 5px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-size: 13px;
            outline: none;
        }

        .type-row textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            border: 2px dashed var(--accent-color);
            color: var(--accent-color);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: #f0f7ff;
        }

        .btn-del {
            color: var(--danger-color);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }

        .final-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-main {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-export-img {
            background: var(--success-color);
            transition: 0.2s;
        }

        .btn-export-img:hover {
            background: #218838;
        }

        .btn-export-img:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #autoSaveTip {
            font-size: 12px;
            color: var(--success-color);
            text-align: center;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* =========================
           右侧预览区
           ========================= */
        .preview-area {
            flex: 1;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-right: 8px;
        }

        .guide-paper {
            background: #fff;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
        }

        .p-header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .p-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .p-tag {
            background: #f0f4f8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .p-item {
            border-left: 4px solid var(--accent-color);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .p-day-label {
            background: var(--accent-color);
            color: #fff;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .p-row {
            margin-bottom: 8px;
        }

        .p-row b {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .p-row p {
            font-size: 14px;
            padding-left: 24px;
            color: #444;
            white-space: pre-wrap;
            margin-top: 4px;
            overflow-wrap: anywhere;
        }

        .p-tip-box {
            background: #fff9db;
            border: 1px solid #ffe58f;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 30px;
        }

        .p-footer {
            background: var(--primary-color);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 12px;
            border-radius: 4px;
            line-height: 1.6;
        }

        /* =========================
           自定义滚动条
           ========================= */
        .edit-area::-webkit-scrollbar,
        .preview-area::-webkit-scrollbar {
            width: 14px;
        }

        .edit-area::-webkit-scrollbar-track,
        .preview-area::-webkit-scrollbar-track {
            background-color: #f4f6f9;
            border-left: 1px solid #e2e8f0;
        }

        .edit-area::-webkit-scrollbar-thumb,
        .preview-area::-webkit-scrollbar-thumb {
            background-color: #4a72a5;
            border-radius: 2px;
            border: 2px solid #f4f6f9;
        }

        .edit-area::-webkit-scrollbar-thumb:hover,
        .preview-area::-webkit-scrollbar-thumb:hover {
            background-color: #3b5c87;
        }

        .edit-area::-webkit-scrollbar-button:single-button:vertical:decrement,
        .preview-area::-webkit-scrollbar-button:single-button:vertical:decrement {
            height: 16px;
            background-color: #f4f6f9;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%234a72a5'><polygon points='50,20 10,80 90,80'/></svg>");
            background-size: 9px;
            background-position: center;
            background-repeat: no-repeat;
            border-left: 1px solid #e2e8f0;
        }

        .edit-area::-webkit-scrollbar-button:single-button:vertical:decrement:hover,
        .preview-area::-webkit-scrollbar-button:single-button:vertical:decrement:hover {
            background-color: #e2e8f0;
        }

        .edit-area::-webkit-scrollbar-button:single-button:vertical:increment,
        .preview-area::-webkit-scrollbar-button:single-button:vertical:increment {
            height: 16px;
            background-color: #f4f6f9;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%234a72a5'><polygon points='50,80 10,20 90,20'/></svg>");
            background-size: 9px;
            background-position: center;
            background-repeat: no-repeat;
            border-left: 1px solid #e2e8f0;
        }

        .edit-area::-webkit-scrollbar-button:single-button:vertical:increment:hover,
        .preview-area::-webkit-scrollbar-button:single-button:vertical:increment:hover {
            background-color: #e2e8f0;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .edit-area,
            .preview-area {
                max-height: none;
                overflow: visible;
            }

            .top-inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="edit-area">

        <h2 style="color: var(--primary-color); margin-bottom: 20px;">
            <i class="fas fa-magic"></i> 任务指引生成器
        </h2>

        <div class="data-panel">

            <div class="data-panel-title">
                <i class="fas fa-database"></i> 模板与数据管理
            </div>

            <div class="data-btns">

                <button
                    class="btn-data btn-export-json"
                    onclick="exportJSON()">
                    <i class="fas fa-download"></i> 导出 JSON
                </button>

                <button
                    class="btn-data btn-import-json"
                    onclick="document.getElementById('jsonUpload').click()">
                    <i class="fas fa-upload"></i> 导入 JSON
                </button>

                <input
                    type="file"
                    id="jsonUpload"
                    style="display:none;"
                    accept=".json,application/json"
                    onchange="importJSON(event)">
            </div>
        </div>

        <div class="top-inputs">

            <input
                type="text"
                id="classInput"
                class="input-item"
                placeholder="班级（如：三(1)班）">

            <input
                type="text"
                id="unitInput"
                class="input-item"
                placeholder="单元（如：Unit 5）">

            <input
                type="text"
                id="dateInput"
                class="input-item"
                placeholder="日期">

        </div>

        <button class="btn-add" id="addTaskBtn">
            <i class="fas fa-plus-circle"></i> 新增 Day 任务阶段
        </button>

        <div id="taskContainer"></div>

        <div style="margin-top:20px;">

            <label
                style="font-weight:bold; font-size:14px; color:#444;">
                底部温馨提示：
            </label>

            <textarea
                id="tipInput"
                class="input-item"
                style="height:80px; margin-top:8px;"
                placeholder="在此输入给家长或学生的温馨提示..."></textarea>

        </div>

        <div class="final-actions">

            <button
                class="btn-main btn-export-img"
                id="downloadImgBtn">
                <i class="fas fa-image"></i> 生成并导出指引图片
            </button>

        </div>

        <div id="autoSaveTip">
            ✅ 已自动保存至浏览器缓存
        </div>

    </div>

    <div class="preview-area">

        <div class="guide-paper" id="guidePaper">

            <div class="p-header">

                <h1 style="color:var(--primary-color); font-size:28px;">
                    课后任务进程指引
                </h1>

                <div style="
                    font-size:12px;
                    color:#888;
                    font-weight:bold;
                    letter-spacing:2px;
                    margin-top:4px;
                ">
                    HOMEWORK PROGRESS GUIDE
                </div>

                <div class="p-tags">
                    <span class="p-tag" id="p-class">未填班级</span>
                    <span class="p-tag" id="p-unit">未填单元</span>
                    <span class="p-tag" id="p-date">未选日期</span>
                </div>

            </div>

            <div id="p-list"></div>

            <div class="p-tip-box" id="p-tip-area">

                <div style="font-weight:bold; margin-bottom:5px;">
                    <i class="fas fa-lightbulb" style="color:#faad14;"></i>
                    温馨提示 / Tips
                </div>

                <div id="p-tip"></div>

            </div>

            <div class="p-footer">
                坚持每天进步一点点，未来一定会感谢现在的努力！<br>
                🚀 稳定进步 · 追求卓越 · 开启未来
            </div>

        </div>

    </div>

</div>

<script>

    const config = {
        voice: {
            label: '语音任务',
            icon: 'fa-microphone'
        },
        write: {
            label: '书写任务',
            icon: 'fa-pen-nib'
        },
        listen: {
            label: '磨耳朵任务',
            icon: 'fa-headphones'
        },
        word: {
            label: '单词闯关',
            icon: 'fa-spell-check'
        },
        extend: {
            label: '拓展任务',
            icon: 'fa-star'
        }
    };

    let autoSaveTimeout = null;


    flatpickr("#dateInput", {
        locale: "zh",
        dateFormat: "Y.m.d",
        defaultDate: new Date(),
        onChange: triggerUpdate
    });


    function getCurrentData() {

        const tasks = [];

        document
            .querySelectorAll('.task-card')
            .forEach(card => {

                const taskObj = {
                    day: card.querySelector('.day-num').value,
                    week: card.querySelector('.week-num').value,
                    items: {}
                };

                Object.keys(config).forEach(type => {

                    taskObj.items[type] = {
                        checked: card.querySelector(`.cb-${type}`).checked,
                        content: card.querySelector(`.ta-${type}`).value
                    };

                });

                tasks.push(taskObj);

            });

        return {

            class: document.getElementById('classInput').value,

            unit: document.getElementById('unitInput').value,

            date: document.getElementById('dateInput').value,

            tip: document.getElementById('tipInput').value,

            tasks: tasks
        };
    }


    function applyDataToUI(data) {

        document.getElementById('classInput').value =
            data.class || '';

        document.getElementById('unitInput').value =
            data.unit || '';

        document.getElementById('dateInput').value =
            data.date || '';

        document.getElementById('tipInput').value =
            data.tip || '';

        const fp =
            document.getElementById('dateInput')._flatpickr;

        if (fp && data.date) {
            fp.setDate(data.date, false, "Y.m.d");
        }

        const taskContainer =
            document.getElementById('taskContainer');

        taskContainer.innerHTML = '';

        if (
            Array.isArray(data.tasks) &&
            data.tasks.length > 0
        ) {

            data.tasks.forEach(task => {
                createTaskCard(task);
            });

        } else {

            createTaskCard();

        }

        triggerUpdate();
    }


    function triggerUpdate() {

        syncPreview();

        clearTimeout(autoSaveTimeout);

        autoSaveTimeout = setTimeout(() => {

            try {

                const data = getCurrentData();

                localStorage.setItem(
                    'autosave_homework_data',
                    JSON.stringify(data)
                );

                const tip =
                    document.getElementById('autoSaveTip');

                tip.style.opacity = '1';

                setTimeout(() => {
                    tip.style.opacity = '0';
                }, 1500);

            } catch (error) {

                console.error(
                    '自动保存失败：',
                    error
                );

            }

        }, 800);
    }


    window.onload = () => {

        const raw =
            localStorage.getItem(
                'autosave_homework_data'
            );

        if (raw) {

            try {

                applyDataToUI(
                    JSON.parse(raw)
                );

            } catch (error) {

                console.error(
                    '缓存读取失败：',
                    error
                );

                createTaskCard();

            }

        } else {

            createTaskCard();

        }
    };


    function exportJSON() {

        try {

            const data =
                getCurrentData();

            const jsonStr =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            const blob =
                new Blob(
                    [jsonStr],
                    {
                        type:
                            "application/json;charset=utf-8"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement('a');

            const now =
                new Date();

            const timeStr =
                `${now.getFullYear()}` +
                `${(now.getMonth() + 1)
                    .toString()
                    .padStart(2, '0')}` +
                `${now.getDate()
                    .toString()
                    .padStart(2, '0')}` +
                `_` +
                `${now.getHours()
                    .toString()
                    .padStart(2, '0')}` +
                `${now.getMinutes()
                    .toString()
                    .padStart(2, '0')}` +
                `${now.getSeconds()
                    .toString()
                    .padStart(2, '0')}`;

            a.href = url;

            a.download =
                `任务配置备份_${timeStr}.json`;

            a.style.display = 'none';

            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 1000);

        } catch (error) {

            console.error(
                'JSON 导出失败：',
                error
            );

            alert(
                '❌ JSON 导出失败，请重试。'
            );
        }
    }


    function importJSON(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                try {

                    const data =
                        JSON.parse(
                            e.target.result
                        );

                    applyDataToUI(data);

                    localStorage.setItem(
                        'autosave_homework_data',
                        JSON.stringify(
                            getCurrentData()
                        )
                    );

                    const tip =
                        document.getElementById(
                            'autoSaveTip'
                        );

                    tip.innerText =
                        "✅ JSON 数据导入成功并已覆盖缓存";

                    tip.style.opacity =
                        '1';

                    setTimeout(() => {

                        tip.style.opacity =
                            '0';

                        tip.innerText =
                            "✅ 已自动保存至浏览器缓存";

                    }, 2000);

                } catch (error) {

                    console.error(
                        'JSON 导入失败：',
                        error
                    );

                    alert(
                        "❌ JSON 文件格式错误或已损坏！"
                    );
                }
            };

        reader.onerror =
            function() {

                alert(
                    "❌ JSON 文件读取失败，请重新选择文件。"
                );

            };

        reader.readAsText(file);

        event.target.value = '';
    }


    document
        .getElementById('downloadImgBtn')
        .addEventListener(
            'click',
            exportGuideImage
        );


    async function exportGuideImage() {

        const btn =
            document.getElementById(
                'downloadImgBtn'
            );

        const guidePaper =
            document.getElementById(
                'guidePaper'
            );

        const previewArea =
            document.querySelector(
                '.preview-area'
            );

        const cName =
            document
                .getElementById(
                    'classInput'
                )
                .value
                .trim() ||
            '未命名班级';

        const dName =
            document
                .getElementById(
                    'dateInput'
                )
                .value
                .trim() ||
            '日期未知';

        const rawFileName =
            `${cName}-任务进程建议-${dName}.png`;

        const safeFileName =
            rawFileName.replace(
                /[\\/:*?"<>|]/g,
                '-'
            );


        if (
            typeof html2canvas ===
            'undefined'
        ) {

            alert(
                '❌ 图片生成组件没有加载成功。\n\n' +
                '请检查网络后刷新页面，再重新点击导出图片。'
            );

            return;
        }


        btn.disabled = true;

        const oldButtonHTML =
            btn.innerHTML;

        btn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> 正在生成图片...';


        const oldPreviewStyle = {
            maxHeight:
                previewArea.style.maxHeight,

            overflow:
                previewArea.style.overflow,

            paddingRight:
                previewArea.style.paddingRight
        };


        try {

            syncPreview();


            previewArea.style.maxHeight =
                'none';

            previewArea.style.overflow =
                'visible';

            previewArea.style.paddingRight =
                '0';


            await new Promise(resolve => {

                requestAnimationFrame(() => {

                    requestAnimationFrame(
                        resolve
                    );

                });

            });


            if (
                document.fonts &&
                document.fonts.ready
            ) {

                try {

                    await document.fonts.ready;

                } catch (fontError) {

                    console.warn(
                        '字体等待失败：',
                        fontError
                    );
                }
            }


            const exportWidth =
                Math.ceil(
                    guidePaper.scrollWidth
                );

            const exportHeight =
                Math.ceil(
                    guidePaper.scrollHeight
                );


            if (
                exportWidth <= 0 ||
                exportHeight <= 0
            ) {

                throw new Error(
                    '导出区域尺寸异常'
                );
            }


            let exportScale = 2;

            if (exportHeight > 12000) {
                exportScale = 1.5;
            }

            if (exportHeight > 18000) {
                exportScale = 1;
            }


            const canvas =
                await html2canvas(
                    guidePaper,
                    {

                        scale:
                            exportScale,

                        useCORS:
                            true,

                        allowTaint:
                            false,

                        backgroundColor:
                            '#ffffff',

                        logging:
                            false,

                        scrollX:
                            0,

                        scrollY:
                            0,

                        width:
                            exportWidth,

                        height:
                            exportHeight,

                        windowWidth:
                            Math.max(
                                document.documentElement.clientWidth,
                                exportWidth
                            ),

                        windowHeight:
                            Math.max(
                                document.documentElement.clientHeight,
                                exportHeight
                            ),

                        onclone:
                            function(
                                clonedDocument
                            ) {

                                const clonedPaper =
                                    clonedDocument
                                        .getElementById(
                                            'guidePaper'
                                        );

                                if (
                                    clonedPaper
                                ) {

                                    clonedPaper.style.height =
                                        'auto';

                                    clonedPaper.style.maxHeight =
                                        'none';

                                    clonedPaper.style.overflow =
                                        'visible';

                                    clonedPaper.style.boxShadow =
                                        'none';
                                }

                                const clonedPreview =
                                    clonedDocument
                                        .querySelector(
                                            '.preview-area'
                                        );

                                if (
                                    clonedPreview
                                ) {

                                    clonedPreview.style.height =
                                        'auto';

                                    clonedPreview.style.maxHeight =
                                        'none';

                                    clonedPreview.style.overflow =
                                        'visible';

                                    clonedPreview.style.paddingRight =
                                        '0';
                                }
                            }
                    }
                );


            const blob =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        canvas.toBlob(
                            function(result) {

                                if (
                                    result
                                ) {

                                    resolve(
                                        result
                                    );

                                } else {

                                    reject(
                                        new Error(
                                            'Canvas 转换为 PNG 失败'
                                        )
                                    );
                                }

                            },
                            'image/png',
                            1
                        );
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    'a'
                );

            link.href =
                url;

            link.download =
                safeFileName;

            link.style.display =
                'none';

            document.body.appendChild(
                link
            );

            link.click();

            document.body.removeChild(
                link
            );


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


        } catch (error) {

            console.error(
                '图片导出失败：',
                error
            );

            alert(
                '❌ 图片生成失败。\n\n' +
                '错误信息：' +
                (
                    error.message ||
                    error
                ) +
                '\n\n' +
                '你可以先刷新网页后再试一次。'
            );


        } finally {

            previewArea.style.maxHeight =
                oldPreviewStyle.maxHeight;

            previewArea.style.overflow =
                oldPreviewStyle.overflow;

            previewArea.style.paddingRight =
                oldPreviewStyle.paddingRight;


            btn.disabled =
                false;

            btn.innerHTML =
                oldButtonHTML;
        }
    }


    function syncPreview() {

        document.getElementById(
            'p-class'
        ).innerText =
            document.getElementById(
                'classInput'
            ).value ||
            '未填班级';


        document.getElementById(
            'p-unit'
        ).innerText =
            document.getElementById(
                'unitInput'
            ).value ||
            '未填单元';


        document.getElementById(
            'p-date'
        ).innerText =
            document.getElementById(
                'dateInput'
            ).value ||
            '未选日期';


        document.getElementById(
            'p-tip'
        ).innerText =
            document.getElementById(
                'tipInput'
            ).value ||
            '暂无内容。';


        const pList =
            document.getElementById(
                'p-list'
            );

        pList.innerHTML =
            '';


        document
            .querySelectorAll(
                '.task-card'
            )
            .forEach(card => {

                const d =
                    card.querySelector(
                        '.day-num'
                    ).value;

                const w =
                    card.querySelector(
                        '.week-num'
                    ).value;


                const item =
                    document.createElement(
                        'div'
                    );

                item.className =
                    'p-item';


                const dayLabel =
                    document.createElement(
                        'div'
                    );

                dayLabel.className =
                    'p-day-label';

                dayLabel.textContent =
                    `Day ${d} / 星期${w}`;

                item.appendChild(
                    dayLabel
                );


                let hasAny =
                    false;


                Object.keys(
                    config
                ).forEach(type => {

                    const checked =
                        card.querySelector(
                            `.cb-${type}`
                        ).checked;

                    const text =
                        card.querySelector(
                            `.ta-${type}`
                        ).value;


                    if (
                        checked
                    ) {

                        hasAny =
                            true;


                        const row =
                            document.createElement(
                                'div'
                            );

                        row.className =
                            'p-row';


                        const title =
                            document.createElement(
                                'b'
                            );


                        const icon =
                            document.createElement(
                                'i'
                            );

                        icon.className =
                            `fas ${config[type].icon}`;


                        const labelText =
                            document.createTextNode(
                                ` ${config[type].label}`
                            );


                        title.appendChild(
                            icon
                        );

                        title.appendChild(
                            labelText
                        );


                        const paragraph =
                            document.createElement(
                                'p'
                            );

                        paragraph.textContent =
                            text ||
                            '(见课本)';


                        row.appendChild(
                            title
                        );

                        row.appendChild(
                            paragraph
                        );

                        item.appendChild(
                            row
                        );
                    }
                });


                if (
                    !hasAny
                ) {

                    const emptyText =
                        document.createElement(
                            'p'
                        );

                    emptyText.style.fontSize =
                        '12px';

                    emptyText.style.color =
                        '#999';

                    emptyText.style.paddingLeft =
                        '24px';

                    emptyText.textContent =
                        '(此阶段暂未安排任务)';

                    item.appendChild(
                        emptyText
                    );
                }


                pList.appendChild(
                    item
                );
            });
    }


    function createTaskCard(
        data = null
    ) {

        const container =
            document.getElementById(
                'taskContainer'
            );

        const card =
            document.createElement(
                'div'
            );

        card.className =
            'task-card';


        const dayGroup =
            document.createElement(
                'div'
            );

        dayGroup.className =
            'day-group';


        dayGroup.appendChild(
            document.createTextNode(
                'Day '
            )
        );


        const dayInput =
            document.createElement(
                'input'
            );

        dayInput.type =
            'text';

        dayInput.className =
            'day-num';

        dayInput.value =
            data
                ? (
                    data.day ??
                    ''
                )
                : (
                    container.children.length +
                    1
                );


        dayGroup.appendChild(
            dayInput
        );


        dayGroup.appendChild(
            document.createTextNode(
                ' / 星期 '
            )
        );


        const weekInput =
            document.createElement(
                'input'
            );

        weekInput.type =
            'text';

        weekInput.className =
            'week-num';

        weekInput.value =
            data
                ? (
                    data.week ??
                    ''
                )
                : '一';


        dayGroup.appendChild(
            weekInput
        );


        card.appendChild(
            dayGroup
        );


        Object.keys(
            config
        ).forEach(type => {

            const typeRow =
                document.createElement(
                    'div'
                );

            typeRow.className =
                'type-row';


            const label =
                document.createElement(
                    'label'
                );


            const checkbox =
                document.createElement(
                    'input'
                );

            checkbox.type =
                'checkbox';

            checkbox.className =
                `cb-${type}`;


            if (
                data &&
                data.items &&
                data.items[type]
            ) {

                checkbox.checked =
                    !!data.items[type].checked;
            }


            label.appendChild(
                checkbox
            );


            label.appendChild(
                document.createTextNode(
                    ` ${config[type].label}`
                )
            );


            const textarea =
                document.createElement(
                    'textarea'
                );

            textarea.className =
                `ta-${type}`;

            textarea.placeholder =
                '输入任务详情...';


            if (
                data &&
                data.items &&
                data.items[type]
            ) {

                textarea.value =
                    data.items[type].content ||
                    '';
            }


            typeRow.appendChild(
                label
            );

            typeRow.appendChild(
                textarea
            );

            card.appendChild(
                typeRow
            );
        });


        const deleteButton =
            document.createElement(
                'button'
            );

        deleteButton.className =
            'btn-del';

        deleteButton.innerHTML =
            '<i class="fas fa-trash-alt"></i> 移除此天任务';

        deleteButton.addEventListener(
            'click',
            () => {

                card.remove();

                triggerUpdate();

            }
        );


        card.appendChild(
            deleteButton
        );


        container.appendChild(
            card
        );


        card
            .querySelectorAll(
                'input, textarea'
            )
            .forEach(el => {

                el.addEventListener(
                    'input',
                    triggerUpdate
                );

                el.addEventListener(
                    'change',
                    triggerUpdate
                );
            });


        triggerUpdate();
    }


    [
        'classInput',
        'unitInput',
        'dateInput',
        'tipInput'
    ].forEach(id => {

        document
            .getElementById(id)
            .addEventListener(
                'input',
                triggerUpdate
            );

    });


    document
        .getElementById(
            'addTaskBtn'
        )
        .addEventListener(
            'click',
            () => {

                createTaskCard();

            }
        );

</script>

</body>
